[project]
name = "ting-talk"
version = "0.1.0"
description = "Tests for the EP-2350 (Ting) push-to-talk firmware's pure logic"
readme = "README.md"
authors = [
    { name = "Emma Campbell", email = "emma@emmacampbell.dev" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false  # no Python package: the firmware runs on CircuitPython, the app is Swift

[tool.pytest.ini_options]
pythonpath = ["firmware/lib"]
