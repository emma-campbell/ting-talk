name: Release

# Releases only happen by hand: Actions → Release → "Run workflow", or
#   gh workflow run release.yml -f version=0.1.0
# It tests and builds main, then creates the v<version> tag and the GitHub
# Release with TingTalk.zip attached. Merging or pushing tags never releases.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the request
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main, not $GITHUB_REF."; exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' isn't a version like 0.1.0 or 0.2.0-beta.1."; exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."; exit 1
          fi
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path app
      - name: Build TingTalk.app
        run: scripts/build-app.sh "$VERSION" "${{ github.run_number }}"
      - name: Check the app bundle
        run: scripts/check-app.sh
      - name: Publish release
        run: |
          gh release create "v$VERSION" dist/TingTalk.zip \
            --target "$GITHUB_SHA" \
            --title "TingTalk v$VERSION" \
            --generate-notes \
            --notes "Ad-hoc signed (not notarized): on first launch, right-click TingTalk.app and choose Open, or run \`xattr -dr com.apple.quarantine TingTalk.app\`."
