name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-tests:
    name: Firmware logic (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest -q

  app:
    name: App tests and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test --package-path app
      - name: Build TingTalk.app
        run: scripts/build-app.sh "0.0.0-ci.${{ github.run_number }}" "${{ github.run_number }}"
      - name: Check the app bundle
        run: scripts/check-app.sh
      - uses: actions/upload-artifact@v7
        with:
          # Upload the zip as-is (named TingTalk.zip) instead of zipping it again.
          path: dist/TingTalk.zip
          archive: false
          retention-days: 14
