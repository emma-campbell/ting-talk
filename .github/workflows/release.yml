name: Release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build
# TingTalk.app and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path app
      - name: Build TingTalk.app
        run: scripts/build-app.sh "${GITHUB_REF_NAME#v}" "${{ github.run_number }}"
      - name: Check the app bundle
        run: scripts/check-app.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TingTalk.zip \
            --title "TingTalk $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Ad-hoc signed (not notarized): on first launch, right-click TingTalk.app and choose Open, or run \`xattr -dr com.apple.quarantine TingTalk.app\`."
